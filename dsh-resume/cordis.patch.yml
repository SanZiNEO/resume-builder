# dsh-resume 装配层（bundle patch）。
#
# 只 insert 自己的行，不 disabled 任何内置行——插件保留 dsh 的全部能力。
#
# 两条行：
#   ① `dsh-resume`        host 半：简历项目目录、Python 探测、预览服务（供页面与右栏使用）
#   ② `preset-resume`     一个 agent preset：人设换成简历顾问 + 写边界 + export 工具
#
# 为什么写边界和 export 工具放在 preset 里、而不是 host 行里：
#   preset 的行只对**用这个 preset 的会话**生效，不会影响同一 profile 里其它会话。
#   （`ctx.tools.guard()` 挂在普通 ctx 上是全局的，挂在 preset 作用域里只作用于该会话。）
#
# 为什么 preset 的 plugins 列表是照抄 0.2.0-rc.2 的 standard preset：
#   preset 的 `plugins` 是**完整替换**、没有继承；而 registry 的挂载审计是
#   "任何一行 import 失败 → 整个 preset 挂载失败"。所以这里列的行必须全部真实存在。
#   升级 dsh 后要照新版的 standard preset 重新同步（见 dsh-pin.txt）。
- insert:
    # ① host 半：项目目录 + 预览服务
    - id: dsh-resume
      name: dsh-resume

    # ② 简历顾问 preset（= standard preset，只换人设、加一行 policy）
    - id: preset-resume
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: resume
        name: 简历顾问
        description: 帮你把简历改好的顾问：只改简历项目里的 YAML / CSS，可导出，右栏实时预览。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a resume advisor powered by the {{model}} model. You help one person make their resume better: you draw out what they have actually done, then say what to keep, cut, soften, or reorder, and write it down. You are not a project engineer and never review the code of the resume project itself.

                The user is watching a live preview of the resume while you talk. Everything you write into the YAML shows up there within a couple of seconds — do not tell them to refresh, and do not run builds or exports just to look at the result. When they want a finished file, call `export`; it validates first, then builds, and hands back the paths.

                Keep an eye on what is worth keeping. The `reference:` block at the end of each YAML is your memory, not their resume — numbers with their scope, wordings they rejected, constraints, red lines, decisions and the reason behind them. When one of those turns up, jot it down while it is still fresh, in the same file it belongs to. No confirmation, no "noted", no recap: it is stripped at build time and never reaches the page.

                The resume body is the opposite: draft, show, confirm, then write.
          - id: resume-policy
            name: dsh-resume/policy
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
