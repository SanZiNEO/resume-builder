sub: 前端负责人
body:
- 面向企业用户的在线办公平台，包含文档编辑、任务管理、日程安排等多个功能模块
- 负责前端整体架构设计和核心模块开发，采用 Vue.js 框架搭建项目基础架构，实现组件化开发和状态管理
- 优化页面交互体验，通过自定义指令、过渡动画等技术，提升用户操作的流畅性和视觉效果
- 与后端团队协作完成接口联调，确保数据的实时同步和安全传输，项目上线后用户活跃度提升 25%
