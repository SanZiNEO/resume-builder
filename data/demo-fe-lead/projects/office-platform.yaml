reference:
  用户提供项目背景： >
    企业在线办公平台，含文档编辑、任务管理、日程安排等多模块。
    项目面向企业客户，不是个人工具，所以对权限、数据同步、稳定性要求高。
  用户角色： >
    前端负责人。
  项目起源与决策： >
    平台初期功能模块多、页面结构复杂，如果每个页面都单独写，
    后续维护和扩展会很困难。
    张三先搭建了 Vue.js 基础架构，做组件化拆分和统一状态管理，
    再开始铺业务模块，避免后期返工。
  技术方案： >
    Vue.js 整体架构 + 组件化 + 状态管理；
    自定义指令/过渡动画优化体验；
    与后端协作接口联调、实时同步、安全传输。
  关键结果： >
    上线后用户活跃度提升 25%。
  简历写法： >
    写“前端架构设计 + 核心模块 + 协作交付 + 活跃提升”，避免空泛“优化体验”。
  面试主线： >
    ① 怎么拆模块；② 多人协作下前端怎么保证一致性；
    ③ 数据实时同步和安全传输怎么处理。
  不写入： >
    未证明的“用户好评”、无法解释的指标；
    团队内部具体分工细节（如果面试问，可口头展开）。
  2026-09-05 确认： >
    这是“从执行开发到前端负责人”的过渡项目，
    体现的是“能独立负责一个完整产品线”的能力。
