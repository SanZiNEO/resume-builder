reference:
  用户提供项目背景： >
    电商中后台是老系统，jQuery 技术债严重，50+ 业务模块，
    维护成本高、首屏慢，业务迭代速度也受影响。
  用户角色： >
    核心开发者。
  项目起源与决策： >
    重构不能一次性全量切，风险太大。
    张三分阶段做：先盘点业务模块，确定迁移优先级；
    先做边缘模块，再切核心模块；
    期间老代码和新代码并存，通过灰度/影子数据做回归对比。
    这套“技术债治理”方法比单纯“重写”更有价值。
  技术方案： >
    React 16 + TypeScript 全量重构；
    通用业务组件库；状态管理方案；
    路由级代码分割 + 资源压缩。
  关键数字： >
    覆盖 50+ 业务模块、复用率提升 60%、首屏 6s→2s。
  数字口径： >
    复用率/首屏时间需能解释测量方式；
    不要写成“提升了 XX%”却不给口径。
  简历写法： >
    突出技术债治理方法论，可讲迁移策略、兼容、灰度、回归。
  面试主线： >
    ① 怎么判断重构优先级；
    ② 迁移期间怎么保证业务不中断；
    ③ 怎么验证重构后没有回归。
  不写入： >
    具体业务模块名、未经验证的收益；
    纯前端框架细节，HR 不用知道。
  2026-09-05 补充： >
    这是中厂经历里的“工程化”代表作，
    为后续低代码和微前端项目提供基础能力。
