body:
- 主导电商中后台系统从 jQuery 到 React 16 + TypeScript 的全量重构，覆盖 50+ 业务模块
- 设计通用业务组件库与状态管理方案，模块间代码复用率提升 60%
- 构建性能优化：路由级代码分割 + 资源压缩，首屏加载时间从 6s 降至 2s
