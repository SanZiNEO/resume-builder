reference:
  用户提供的早期经历： >
    毕业设计《基于 WebRTC 的实时协同编辑系统》，张三本科毕业设计。
    这是他第一次接触实时通信和并发冲突问题。
  项目起源与决策： >
    当时想做“多人同时编辑同一文档”，看起来简单，
    但实际核心难点是并发冲突：两个人同时改同一个位置怎么办。
    张三调研后选择 OT 算法，而不是简单最后写入覆盖；
    这也是他后来理解“算法如何解决真实工程问题”的重要节点。
  技术方案： >
    WebRTC 传输、OT 算法解决并发冲突、光标实时同步、在线人数展示。
  结果： >
    获院级优秀毕业论文。
  简历定位： >
    早期项目，证明本科已有工程实现和算法基础；不是主力，篇幅最小。
  面试主线： >
    如果被问到，可从“多人协同的并发冲突”讲起，
    讲为什么用 OT、怎么同步光标、实时通信遇到什么问题。
  不写入： >
    过多实现细节；
    不必在简历里展开成完整项目；
    不写“高并发/大规模实时协同”等超出实际范围的表述。
  2026-09-05 补充： >
    这个项目在成长线里是“起点”，
    后面所有工程化/架构项目都能从这里找到最初的技术兴趣。
