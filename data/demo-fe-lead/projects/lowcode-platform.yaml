heading: 三维可视化低代码配置平台
heading_style: [left-bar-accent]
item_style: [bg-white, border-rounded, shadow-soft]
tag_style: [tag-pill]
meta: 2020.01 – 2021.04
sub: 技术负责人 / 核心开发者
tags: [React, 低代码, Three.js, 数字孪生]
body:
  - "自研三维可视化低代码平台，基于 JSON Schema 驱动表单、表格、图表、三维场景配置，业务人员无需开发即可搭建可视化大屏与数字孪生场景"
  - "基于 Three.js / WebGL 实现三维场景渲染、多视角切换、动画与交互，优化加载性能与内存管理"
  - "前端采用 React + Formily + Ant Design，实现可视化拖拽编辑器 + 配置解析引擎双架构"
  - "后端 Node.js + MongoDB 存储配置模板和页面元数据，支持多环境发布"
  - "累计沉淀 200+ 可复用组件模板，公司内部 15 个业务线使用，减少重复开发工时约 3000 人/天"

reference:
  用户提供项目背景： >
    低代码平台不是公司正式立项，是张三先自研了一个表单配置 demo，
    拿给业务方看后逐步转成正式项目。
    后来业务方提出大屏 / 数字孪生场景需求，平台从 2D 配置扩展到三维可视化场景配置。
    当时团队只有 4 个前端，业务页面需求每周都在增加，靠排期堆人力不可持续。
  用户角色： >
    技术负责人 / 核心开发者。
  项目起源与决策： >
    2020 年初，团队每天做大量重复中后台页面，运营/产品常提“改个配置就行”，
    但每次都要前端排期。
    张三先用业余时间做了表单配置 demo，业务方觉得有用，后来才正式立项。
    中间考虑过 iframe 拼页面，但状态同步和权限很难做，改成了 JSON Schema 驱动。
    后期引入 Three.js / WebGL 做三维场景，重点解决渲染性能与组件复用。
    这个决策面试一定会讲。
  技术方案： >
    JSON Schema 驱动表单/表格/图表/三维场景；
    前端 React + Formily + Ant Design；
    Three.js / WebGL 场景渲染与可视化编辑器；
    后端 Node.js + MongoDB；多环境发布。
  业务落地： >
    200+ 组件模板、15 条业务线、减少重复开发约 3000 人/天。
  数字口径： >
    “3000 人/天”是估算，不是系统埋点；面试被追问应主动说明。
  简历写法： >
    重点写“三维可视化 + 低代码 + 数字孪生 + 业务规模化复用”；
    不写 Formily/AntD 实现细节。
  面试主线： >
    ① 三维场景怎么配置化；
    ② 渲染性能怎么优化；
    ③ 怎么让业务方接受；
    ④ 怎么从 4 人团队推广到 15 条业务线。
  不写入： >
    Formily、Ant Design 等实现细节；
    空泛的“低代码很厉害”；
    未经验证的收益数字。
  2026-09-05 确认： >
    这是岗位定制版头牌项目，突出“三维可视化 + 低代码”双能力。
