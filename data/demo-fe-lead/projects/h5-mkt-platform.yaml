body:
  - "开发可视化 H5 营销页面搭建平台，运营人员拖拽组件即可生成活动页面"
  - "提供 30+ 营销组件模板（抽奖/签到/拼团/秒杀等），支持一键发布与数据埋点"
  - "非技术运营人员自助创建活动 100+ 场，单场活动最高带来 10 万+ 访问"

reference:
  用户提供项目背景： >
    创业公司阶段，运营想快速做营销活动，但每次都要开发介入，周期长成本高。
    张三当时是前端第 1 号员工，同时承担全栈开发。
  用户角色： >
    全栈开发，前端 Vue.js，后端 Node.js。
  项目起源与决策： >
    运营每次做活动都要提需求、等排期、等上线，最快也要几天。
    张三先做了一个简单的拖拽页面 demo，让运营自己拼活动页，
    发现可行后才扩展成完整平台。
    组件模板一开始只有抽奖、签到几个，后来逐步补到 30+，
    覆盖拼团、秒杀、优惠券、表单收集等常见玩法。
  技术方案： >
    可视化拖拽搭建 + 30+ 营销组件（抽奖/签到/拼团/秒杀等）
    + 一键发布 + 数据埋点；
    前端 Vue.js，后端 Node.js。
  业务结果： >
    非技术运营自助创建活动 100+ 场，单场最高 10 万+ 访问。
  简历写法： >
    突出“赋能非技术运营”和“业务结果”，不要写成纯组件库；
    “100+ 场 / 10 万访问”必须保留且能讲出来源。
  面试主线： >
    ① 为什么运营需要它；
    ② 组件模板怎么拆分；
    ③ 数据埋点怎么支撑活动复盘。
  不写入： >
    具体组件实现、代码量等与业务价值无关细节；
    未经验证的“提升转化率”“节省 XX 人天”。
  2026-09-05 补充： >
    这个项目用来证明“从 0 到 1 的产品思维”，
    是创业公司经历里最能体现独立交付的项目。
