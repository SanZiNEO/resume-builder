title: Summary
section_style: [underline-title]
content: 10 年前端开发经验，5 年技术团队管理经验。历经互联网创业公司到万人规模大厂，对前端工程化、性能优化、跨端解决方案有深入实践。主导过多个从 0 到 1 的大型项目架构设计，微前端架构服务日活 500 万+。擅长搭建高效研发体系，推动团队技术基建从无到有。开源爱好者，GitHub 累计 2000+ star。

reference:
  context: >
    摘要定位：让 HR 在 3 秒内知道张三“是谁、做过什么、强在哪”。
    当前版本强调 10 年经验、团队管理、0 到 1、大厂、500 万日活、2000 star。
  wording_rules: >
    摘要只写能力标签与最大数字，不展开项目；
    不用“精通”“资深”等空词；
    数字口径：10 年、5 年、500 万+、2000+ star。
  versions: >
    技术管理版：突出团队 12 人、微前端、技术体系建设；
    架构师版：突出微前端、低代码、性能优化；
    全栈版：弱化管理，补充 Node.js / 后端协作。
  do_not: >
    不写框架清单；不写自身不足；不写与求职方向无关的开源/爱好。
