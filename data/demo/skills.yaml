reference:
  用户能力记录： >
    技能清单为真实能力，默认都会；学习面广，单点深度为熟练到资深。
  整理原则： >
    ① 跟岗位强相关；
    ② 非技术 HR 能看懂；
    ③ 每个词都能在项目/经历中找到证据。
  排版记录： >
    skills-grid 九宫格，每组必须独立 item；
    卡片按渲染行数重排，避免同行高度悬殊。
  措辞记录： >
    不写“精通”“大师”；不写太细库名；
    “开源与社区”保留 star 数但不替代技术能力。
