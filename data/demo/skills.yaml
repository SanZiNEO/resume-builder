reference:
  用户提供能力信息： >
    技能清单为真实能力，默认都会；学习面广，单点深度为熟练到资深。
    用户不愿意写“精通/大师”，因为容易被追问，也显得虚。
  整理原则： >
    ① 跟岗位强相关；
    ② 非技术 HR 能看懂；
    ③ 每个词都能在项目/经历中找到证据。
    2026-09-05 讨论后确认：技能不是越多越好，必须能对应到项目证据。
  能力边界记录： >
    React / Vue 等框架能讲工程化实践，不按“源码级”写；
    Node.js / 后端属于协作够用，不按后端岗写；
    微前端和低代码是架构主能力；
    性能优化、监控、工程化是当前阶段核心；
    团队协作要保留，因为目标岗位包含技术负责人。
  排版记录： >
    skills-grid 九宫格，每组必须独立 item（1 item = 1 block）；
    卡片按渲染行数重排，避免同行高度悬殊。
    2026-09-05 确认：技能分组按“前端基础 / 框架与库 / 工程化 / 跨端 / 性能 / 后端 / 架构 / 开源 / 团队”九类。
  措辞决策： >
    不写“精通”“大师”；
    不写太细库名；
    “开源与社区”保留 star 数，但不替代技术能力；
    “团队协作”保留，因为能支撑技术负责人/带团队经历。
  后续调整： >
    如果投纯架构岗，可把后端与工具弱化；
    如果投全栈岗，可把 Node.js / Express 提前；
    如果投管理岗，可把团队协作和架构设计往前放。
