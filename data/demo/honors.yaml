reference:
  context: >
    荣誉用于增强可信度，但不建议写成“获奖清单”。
    只保留与岗位相关、有分量、能展开的奖项。
  resume_rules: >
    空间不足时只保留公司级最佳技术贡献奖和 Hackathon 一等奖；
    每个奖项尽量和项目/经历对应，例如微前端落地对应技术创新特等奖。
  do_not: >
    不写兴趣类、无证书类、比赛未获奖、与岗位无关的活动。
  wording: >
    奖项用「年份 + 奖项 + 说明」短句，不堆砌形容词。
