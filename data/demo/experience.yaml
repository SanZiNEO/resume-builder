reference:
  用户提供工作经历： >
    ① 2016.06-2019.02 上海某创业公司，前端第 1 号员工，从 0 到 1；
    ② 2019.03-2021.05 某互联网科技公司，高级前端，中后台重构/低代码/性能；
    ③ 2021.06-至今 某大型互联网公司，资深前端/前端负责人，微前端/团队管理。
  整理后的叙事线： >
    先讲创业公司“从 0 到 1 完整交付”，再讲中厂“复杂业务架构演进”，
    最后讲大厂“规模化与团队管理”。
  关键数字记录： >
    日活 500 万+、团队 12 人、微前端整合 8 个子应用、
    切换 3s→0.3s、新项目初始化天级→分钟级、LCP 3.2s→1.8s、CLS 0.25→0.08、
    故障率下降 60%、CI 12min→3min、活动 100+ 场。
  简历写法： >
    每段只留 3-5 条最强项；创业经历强调独立/全能，大厂经历强调规模/协作/管理；
    不写“负责日常开发”流水账。
  不写入： >
    具体公司真名、未经验证增幅/收益、内部敏感信息、与前端无关业务细节。
