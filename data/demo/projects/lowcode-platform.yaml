reference:
  用户提供项目背景： >
    低代码平台不是公司正式立项，是张三先自研了一个表单配置 demo，
    拿给业务方看后逐步转成正式项目。
    当时团队只有 4 个前端，业务页面需求每周都在增加，靠排期堆人力不可持续。
  用户角色： >
    技术负责人 / 核心开发者。
  项目起源与决策： >
    2020 年初，团队每天做大量重复中后台页面，运营/产品常提“改个配置就行”，
    但每次都要前端排期。
    张三先用业余时间做了表单配置 demo，业务方觉得有用，后来才正式立项。
    中间考虑过 iframe 拼页面，但状态同步和权限很难做，改成了 JSON Schema 驱动。
    这个决策面试一定会讲。
  技术方案： >
    JSON Schema 驱动表单/表格/图表/流程；
    前端 React + Formily + Ant Design；
    可视化拖拽编辑器 + 配置解析引擎双架构；
    后端 Node.js + MongoDB；
    多环境 dev/staging/prod。
  业务落地： >
    200+ 组件模板、15 条业务线、减少重复开发约 3000 人/天。
    推广过程从 4 人团队扩展到 15 条业务线，中间做了使用文档和业务培训。
  数字口径： >
    “3000 人/天”是估算，不是系统埋点；面试被追问应主动说明。
  简历写法： >
    重点写“配置化降低开发成本 + 业务规模化复用”，不写 Formily/AntD 细节；
    “15 条业务线 / 3000 人/天”是核心数字。
  面试主线： >
    ① 配置模型怎么设计；
    ② 怎么让业务方接受；
    ③ 怎么从 4 人团队推广到 15 条业务线。
  不写入： >
    Formily、Ant Design 等实现细节；
    空泛的“低代码很厉害”；
    未经验证的收益数字。
  2026-09-05 确认： >
    这是头牌项目，定位是“架构能力 + 业务价值”，
    其他项目 reference 要围绕这个项目的深度来展开。
