title: Projects
heading: 中后台低代码配置平台
heading_style: [left-bar-accent]
item_style: [bg-white, border-rounded, shadow-soft]
tag_style: [tag-pill]
meta: 2020.01 – 2021.04
sub: 技术负责人 / 核心开发者
tags: [React, 低代码, JSON Schema]
body:
  - "自研中后台低代码方案，基于 JSON Schema 驱动表单、表格、图表、流程的配置化生成，运营人员无需开发即可搭建管理页面"
  - "前端采用 React + Formily + Ant Design 技术栈，实现可视化拖拽编辑器 + 配置解析引擎双架构"
  - "后端 Node.js + MongoDB 存储配置模板和页面元数据，支持多环境（dev/staging/prod）发布"
  - "累计沉淀 200+ 可复用组件模板，公司内部 15 个业务线使用，减少重复开发工时约 3000 人/天"

reference:
  context: >
    中后台低代码配置平台，张三作为技术负责人 / 核心开发者，
    是简历中“架构能力”的头牌项目。
    背景：公司内部大量重复的中后台页面开发，业务需求增长快，人力跟不上。
  methodology: >
    JSON Schema 驱动表单/表格/图表/流程；
    前端 React + Formily + Ant Design；
    可视化拖拽编辑器 + 配置解析引擎双架构；
    后端 Node.js + MongoDB 存储模板与页面元数据；
    支持多环境 dev/staging/prod 发布。
  outputs: >
    200+ 可复用组件模板、15 条业务线使用、减少重复开发工时约 3000 人/天。
  resume_rules: >
    重点写“配置化降低开发成本 + 业务规模化复用”，不写具体组件库细节；
    “15 条业务线 / 3000 人/天”是核心数字，面试要能解释估算口径。
  wording_rules: >
    「自研 / 主导 / 沉淀」优于“参与”；数字放句尾；不写泛泛“提升了效率”。
