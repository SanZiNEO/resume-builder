meta: 2020.01 – 2021.04
sub: 技术负责人 / 核心开发者
tags: [React, 低代码, JSON Schema]
body:
  - "自研中后台低代码方案，基于 JSON Schema 驱动表单、表格、图表、流程的配置化生成，运营人员无需开发即可搭建管理页面"
  - "前端采用 React + Formily + Ant Design 技术栈，实现可视化拖拽编辑器 + 配置解析引擎双架构"
  - "后端 Node.js + MongoDB 存储配置模板和页面元数据，支持多环境（dev/staging/prod）发布"
  - "累计沉淀 200+ 可复用组件模板，公司内部 15 个业务线使用，减少重复开发工时约 3000 人/天"

reference:
  用户提供项目背景： >
    低代码平台不是公司正式立项，是张三先自研了一个表单配置 demo，
    拿给业务方看后逐步转成正式项目。
    当时团队只有 4 个前端，业务页面需求每周都在增加，靠排期堆人力不可持续。
  用户提供项目角色： >
    技术负责人 / 核心开发者。
  整理后的技术方案： >
    JSON Schema 驱动表单/表格/图表/流程；
    前端 React + Formily + Ant Design；
    可视化拖拽编辑器 + 配置解析引擎双架构；
    后端 Node.js + MongoDB；多环境发布。
  关键数字记录： >
    200+ 可复用组件模板、15 条业务线、减少重复开发约 3000 人/天。
  数字口径： >
    “3000 人/天”是估算，不是系统埋点；面试被追问应主动说明。
  已确认不写入简历： >
    Formily、Ant Design 等实现细节；空泛“低代码很厉害”。
  写作定位： >
    头牌项目，体现架构能力 + 业务价值。
