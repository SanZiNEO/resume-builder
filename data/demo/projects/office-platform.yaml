reference:
  用户提供项目背景： >
    企业在线办公平台，含文档编辑、任务管理、日程安排等多模块。
  用户角色： >
    前端负责人。
  整理工作内容： >
    Vue.js 整体架构 + 组件化 + 状态管理；
    自定义指令/过渡动画优化体验；
    与后端协作接口联调、实时同步、安全传输。
  关键结果： >
    上线后用户活跃度提升 25%。
  简历写法： >
    写“前端架构设计 + 核心模块 + 协作交付 + 活跃提升”，避免空泛“优化体验”。
  不写入： >
    未证明的“用户好评”、无法解释的指标。
