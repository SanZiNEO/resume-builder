reference:
  context: >
    H5 营销活动配置平台，张三全栈开发，创业公司阶段的项目。
    背景：运营想快速做活动，但每次都需要开发介入，周期长、成本高。
  methodology: >
    可视化拖拽搭建 + 30+ 营销组件（抽奖/签到/拼团/秒杀等）
    + 一键发布 + 数据埋点；前端 Vue.js，后端 Node.js。
  values: >
    非技术运营人员自助创建活动 100+ 场，单场最高 10 万+ 访问。
  resume_rules: >
    突出“赋能非技术运营”和“业务结果”，不要写成纯组件库；
    “100+ 场 / 10 万访问”必须保留且能讲出来源。
  wording_rules: >
    “开发”写成“实现/搭建”，强调产品价值而不是代码量。
