body:
  - "开发可视化 H5 营销页面搭建平台，运营人员拖拽组件即可生成活动页面"
  - "提供 30+ 营销组件模板（抽奖/签到/拼团/秒杀等），支持一键发布与数据埋点"
  - "非技术运营人员自助创建活动 100+ 场，单场活动最高带来 10 万+ 访问"

reference:
  用户提供项目背景： >
    创业公司阶段，运营想快速做营销活动，但每次都要开发介入，周期长成本高。
  用户角色： >
    全栈开发，前端 Vue.js，后端 Node.js。
  整理方案： >
    可视化拖拽搭建 + 30+ 营销组件（抽奖/签到/拼团/秒杀等）
    + 一键发布 + 数据埋点。
  关键结果： >
    非技术运营自助创建活动 100+ 场，单场最高 10 万+ 访问。
  简历写法： >
    突出“赋能非技术运营”和“业务结果”，不要写成纯组件库。
  不写入： >
    具体组件实现、代码量等与业务价值无关细节。
