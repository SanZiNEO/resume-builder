reference:
  context: >
    示例人物：张三，男，32 岁，上海大学计算机科学与技术本科。
    10 年前端开发经验，5 年技术团队管理经验。
    当前在职，看上海 / 杭州大中型互联网公司的前端架构、前端负责人、技术负责人机会。
  identity: >
    定位：技术型前端负责人 / 架构师，不是纯执行开发；
    核心能力：从 0 到 1 架构、微前端、低代码、性能优化、团队管理。
  career_path: >
    2013.09 - 2017.06  上海大学 计算机科学与技术 本科；
    2016.06 - 2019.02  上海某创业公司 前端开发工程师（第 1 号前端）；
    2019.03 - 2021.05  某互联网科技公司 高级前端开发工程师；
    2021.06 - 至今      某大型互联网公司 资深前端工程师 / 前端技术负责人。
  targets: >
    主投：前端架构师 / 技术负责人 / 全栈工程师；
    管理岗优先，投纯执行岗时弱化团队管理、强化架构与性能；
    不投纯算法、纯后端、非技术岗位。
  do_not: >
    ① 不写与前端/管理无关的业余爱好；
    ② 不虚构工作经历和数字；
    ③ 不写无法在面试中展开的项目；
    ④ 不写这套简历构建工具等元项目；
    ⑤ 不写具体公司名称，统一用“某”替代。
  need: >
    ① 突出 0 到 1 和架构主导能力；
    ② 每个项目都要有数字：性能、效率、用户、规模；
    ③ 用“问题 → 动作 → 结果”结构写 bullet；
    ④ 保留技术术语作为真实做过证据，但不堆砌实现细节。
  project_lineage: >
    毕业设计（实时协同，入门）→ 创业公司 H5 营销平台（0到1，产品化）→
    电商中后台重构（工程化/性能）→ 在线办公（团队负责）→
    低代码平台（架构负责人）→ 微前端/技术管理（规模化）。
    叙事弧线：从执行 → 架构 → 管理。
  collaboration: >
    AI 修改简历前先读本文件 reference；每改一个文件后运行
    `python make.py validate --person demo`；本文件是虚构示例，
    不要写入真实姓名、电话、邮箱。
