reference:
  用户提供链接信息： >
    GitHub 主页、个人作品集（示例虚构链接）。
    GitHub 上主要有微前端脚手架、低代码引擎、前端监控 SDK 等仓库；
    作品集网站集中展示项目案例、架构图和效果演示。
  整理定位： >
    用于佐证简历真实性；每个链接一句话即可，不要写成项目介绍。
  用户确认原则： >
    优先放有 star / 下载、能打开、面试可演示的项目；
    没有用户/案例的空项目先不写。
    2026-09-05 讨论后确认：链接不是为了凑数量，
    而是让 HR/面试官能快速验证“这个人真的做过”。
  不写入： >
    空链接；
    涉及他人隐私/未公开代码的链接；
    没有实际内容的个人主页。
  后续调整： >
    如果某个仓库获得真实 star 或下载，可以升级成一行数字；
    如果未来有线上作品集页面，可以替换示例链接；
    如果投技术岗，可把 GitHub 位置往前放。
