items:
  - heading: GitHub 主页
    link: https://github.com/
    body:
      - "开源项目与代码仓库，含微前端脚手架、低代码引擎、前端监控 SDK 等"
  - heading: 个人作品集
    link: https://example.com/
    body:
      - "作品集网站，集中展示项目案例与技术实践"

reference:
  context: >
    展示开源项目、作品集网站和技术实践，用于佐证简历真实性。
    链接是免费的可验证证据，应尽量放有真实内容的链接。
  resume_rules: >
    每个链接一句话即可；不要把 GitHub 主页/作品集写得过长；
    若项目没有用户/案例，可先不写，有真实数据后再升级。
  decision: >
    示例采用虚构链接；真实使用时优先放：
    ① 有 star / 下载的项目；
    ② 能打开的作品集；
    ③ 面试可现场演示的工具。
  do_not: >
    不写无内容的空链接；不写涉及他人隐私/未公开代码的链接。
