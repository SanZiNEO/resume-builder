reference:
  context: >
    上海大学计算机本科，2017 届毕业。
    在校期间已表现出工程实践和竞赛能力，为后续职业发展提供基本面。
  packaging_decision: >
    示例用 GPA 前 10%、ACM、毕业设计、技术部部长来撑教育板块；
    真实使用时如果 GPA 不高，可只保留竞赛、项目、论文与岗位相关项。
  school: >
    上海大学（示例虚构）；真实使用时可在学校后加“211/双一流”等客观信息。
  courses: >
    核心课程可写：数据结构、算法、操作系统、计算机网络、数据库、软件工程；
    不建议全部列出，选 3-5 门与岗位相关的即可。
  do_not: >
    不写无证书的社团经历；不写与计算机无关的课程；不写无法解释的奖项。
  wording_rules: >
    标题一行写学校/专业/学历/时间；亮点放 dot-list，每条控制在 1 行。
