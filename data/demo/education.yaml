reference:
  用户学历信息： >
    上海大学，计算机科学与技术专业，本科，2013.09 - 2017.06。
    通过普通高考进入上海大学计算机专业，2017 届本科毕业。
    大学四年主线：编程基础 → 算法竞赛 → 技术社团 → 毕业设计工程实践。
  教育背景整理： >
    GPA 3.7/4.0，专业排名前 10%，连续三年获校级奖学金；
    核心课程：数据结构、算法、操作系统、计算机网络、数据库、软件工程；
    毕业设计《基于 WebRTC 的实时协同编辑系统》获院级优秀毕业论文；
    ACM 校队成员，2015 年省大学生程序设计竞赛银奖；
    学院科技协会技术部部长，组织校级 Hackathon 3 届。
  课程体系记录： >
    数据结构与算法是后续编程和竞赛的底层基础；
    计算机网络为毕业设计 WebRTC、以及后来前端网络请求/性能优化打下基础；
    操作系统和软件工程对后来的工程化体系、团队协作理解有帮助。
  在校项目记录： >
    毕业设计是本科阶段最重要的工程实践：多人实时协同编辑，
    涉及 WebRTC 传输、OT 算法冲突解决、光标同步。
    另外在校期间参与过 ACM 集训，主要训练算法和数据结构。
  学历包装决策： >
    GPA 与排名是真实亮点，可以写；但不写“学霸”“优秀毕业生”等形容词。
    2026-09-05 讨论后确认：即使数据好看，也保留事实即可，
    不靠形容词制造印象。
  学校信息： >
    上海大学（示例虚构）；真实使用时可在学校后加“211 / 双一流”等客观信息。
  面试展开点： >
    ① 毕业设计：WebRTC + OT 算法，能讲并发冲突解决、光标同步和实时通信；
    ② ACM：算法与数据结构基础，能讲竞赛训练对工程思维的影响；
    ③ 技术部部长：组织能力和技术社群经验，体现早期领导力。
    2026-09-05 补充：这三个点是最容易被追问的，必须都能展开。
  不写什么： >
    不写未获奖的社团；不写与计算机无关课程；不写无法解释的奖项；
    不写高考成绩；不写硕士/博士经历（无）。
    其中“不写高考成绩”是 2026-09-05 确认的，他没打算把高考作为亮点。
  排版规则： >
    标题一行：学校 · 专业 · 学历；meta 写时间区间；
    亮点用 dot-list，每条一行；
    教育板块保持精简，不与实习/项目抢版面。
